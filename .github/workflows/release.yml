name: Release

# Push a tag like v0.1.0 to build Hanji.app and open a *draft* GitHub release
# with the zip, its checksum, and the CHANGELOG section as notes. Review the
# draft, then publish it by hand.
#
# Optional repository secrets for a signed + notarized build (otherwise the app
# is signed ad-hoc and the notes explain how to open it):
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   Developer ID Application cert
#   SIGN_ID                                      its identity name
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      SIGN_ID: ${{ secrets.SIGN_ID }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count

      - name: Import signing certificate
        if: env.SIGN_ID != ''
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, check and package
        run: VERSION="${GITHUB_REF_NAME#v}" ./Scripts/release.sh

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Hanji $VERSION" --notes-file dist/notes.md \
            "dist/Hanji-$VERSION.zip" "dist/Hanji-$VERSION.zip.sha256"
